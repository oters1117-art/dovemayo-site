<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>자랑 게시판 · 둘기마요 아바타 생성기</title>
<style>
@font-face{font-family:"Dovemayo Gothic";src:url("../fonts/dovemayo-gothic-latin.woff2") format("woff2");font-display:swap}
:root{--page:#f4f1ee;--card:#fff;--ink:#2b2523;--muted:#7d726e;--rule:#e4ddd8;--accent:#5d4e48;--on:#c9573f}
*{box-sizing:border-box}
body{margin:0;background:var(--page);color:var(--ink);font:15px/1.55 "Pretendard","Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif}
main{max-width:980px;margin:0 auto;padding:28px 16px 64px}
h1{font-size:22px;margin:0}
.back{font-size:13px;color:var(--muted)}
.lead{color:var(--muted);margin:8px 0 18px}
button{font:inherit;color:var(--ink);background:#fff;border:1px solid var(--rule);border-radius:10px;padding:8px 14px;cursor:pointer}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
button.danger{color:var(--on)}
button:disabled{opacity:.45;cursor:default}
button:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--on);outline-offset:2px}
input[type=text]{font:inherit;color:inherit;border:1px solid var(--rule);border-radius:10px;padding:8px 10px;background:#fff;min-width:0}
.new{display:grid;grid-template-columns:120px 1fr;gap:14px;align-items:center;background:var(--card);border:1px solid var(--rule);border-radius:18px;padding:14px;margin-bottom:22px}
.new .face{border-radius:16px;overflow:hidden;aspect-ratio:1}
.new .line{display:flex;gap:8px}
.new .line input{flex:1}
.msg{min-height:1.4em;font-size:13px;color:var(--muted);margin:6px 0 0}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.item{padding:0;border:0;background:none;text-align:center;border-radius:16px;cursor:pointer;display:block;width:100%}
.item .face{border-radius:16px;overflow:hidden;aspect-ratio:1;box-shadow:0 1px 2px rgba(60,40,30,.08),0 6px 16px rgba(60,40,30,.08)}
.face svg{display:block;width:100%;height:100%}
.item{position:relative}
.item .likes{position:absolute;left:6px;top:6px;display:flex;align-items:center;gap:3px;font-size:11px;line-height:1;padding:3px 6px 3px 5px;border-radius:999px;background:rgba(255,255,255,.5);color:var(--ink);opacity:.8;pointer-events:none}
.ic{width:1.15em;height:1.15em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.pop .acts .like{display:inline-flex;align-items:center;gap:5px}
.pop .acts .like[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:#fff}
.item .cap{margin:6px 2px 0;font-size:13px;min-height:1.5em;display:flex;justify-content:center;gap:3px}
.item .cap .name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
/* 이름 옆 파란 댓글 수 [3] */
.cc{color:#2f6bd8;font-weight:600;flex:none}
.empty{color:var(--muted);font-size:13px}
.dim{position:fixed;inset:0;background:rgba(30,24,22,.62);display:flex;align-items:center;justify-content:center;gap:14px;padding:16px;z-index:10}
/* 이전·다음: 카드 밖 양옆 (휴대폰은 화면 아래 양끝) */
.side{flex:none;width:46px;height:46px;padding:0;border-radius:50%;border:0;background:rgba(255,255,255,.88);display:grid;place-items:center;color:var(--ink)}
.side svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.side:disabled{opacity:.25}
@media(max-width:560px){.side{position:fixed;bottom:18px;z-index:11}.side.prev{left:18px}.side.next{right:18px}.dim{padding-bottom:80px}}
/* 세로: 위에 큰 그림, 아래에 글·버튼·댓글 (팝업 안에서 스크롤) */
.pop{background:var(--card);border-radius:20px;padding:16px;width:min(100%,600px);max-height:calc(100vh - 32px);max-height:calc(100dvh - 32px);overflow:auto}
.pop .face{border-radius:16px;overflow:hidden;aspect-ratio:1}
.pop .info{display:flex;flex-direction:column;min-width:0}
.pop:focus{outline:none}
.comments{margin-top:16px;border-top:1px solid var(--rule);padding-top:10px;flex:1}
.comments h2{font-size:13px;margin:0 0 6px;color:var(--muted);font-weight:600}
.comments ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.comments li{display:flex;gap:6px;align-items:flex-start;font-size:14px;background:#f7f4f2;border-radius:10px;padding:6px 8px}
.comments li .body{flex:1;min-width:0;overflow-wrap:anywhere}
.comments li .meta{display:block;font-size:11px;color:var(--muted)}
.comments li .x{flex:none;border:0;background:none;padding:0 2px;color:var(--muted);font-size:16px;line-height:1.2}
.comments li .x:hover{color:var(--on)}
.comments .none{font-size:13px;color:var(--muted)}
.cform{display:flex;gap:6px;margin-top:8px}
.cform input{flex:1}
/* 닉네임: 이름 색은 고른 프리셋 색 */
.nick{font-weight:700}
.pop .byline{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin:6px 2px 10px}
.pop .byline .by{font-size:14px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pop .byline .by .nick{font-weight:400}
.pop .byline .when{margin:0;flex:none}
.comments li .nick{margin-right:6px}
.me{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:-8px 0 18px;font-size:14px;color:var(--muted);position:relative}
.me .dot{width:22px;height:22px;padding:0;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px var(--rule);flex:none}
.me .nick{font-size:15px}
.me .ib{display:inline-grid;place-items:center;width:32px;height:32px;padding:0;border-radius:9px;color:var(--ink)}
.me .ib svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.colors{position:absolute;left:62px;top:30px;z-index:5;background:#fff;border:1px solid var(--rule);border-radius:12px;padding:8px;display:grid;grid-template-columns:repeat(8,26px);gap:6px;box-shadow:0 8px 24px rgba(60,40,30,.16)}
.colors button{width:26px;height:26px;padding:0;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px var(--rule)}
.colors button[aria-selected=true]{box-shadow:0 0 0 2px var(--ink)}
.pop .text{margin:12px 2px 0;white-space:pre-wrap;overflow-wrap:anywhere;text-align:center}
.pop .edit{display:flex;gap:8px;margin-top:12px}
.pop .edit input{flex:1}
.pop .when{font-size:12px;color:var(--muted);margin:2px 2px 10px;text-align:center}
.pop .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.pop .acts a{display:inline-block;text-decoration:none;color:var(--ink);border:1px solid var(--rule);border-radius:10px;padding:8px 14px;background:#fff}
/* 수정·삭제는 이미지 복사·생성기에서 열기 줄의 오른쪽 */
.pop .acts .mine{margin-left:auto;display:flex;gap:8px}
.pop .acts .mine:empty{display:none}
.pop .msg{margin:0 2px 8px;min-height:0;text-align:center}
.pop .msg:empty{display:none}
[hidden]{display:none!important}
@media(max-width:520px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.new{grid-template-columns:88px 1fr}.new .line{flex-direction:column}}
.adminlink{position:fixed;right:8px;bottom:6px;font-size:11px;color:var(--muted);opacity:.35;background:none;border:0;padding:4px;cursor:pointer}.adminlink:hover,.adminlink:focus-visible{opacity:.9}
</style>
</head>
<body>
<main>
  <a class="back" href="../">← 둘기마요 아바타 생성기</a> &nbsp; <a class="back" href="../board/">제안 게시판</a>
  <h1>자랑 게시판</h1>
  <p class="lead">만든 캐릭터를 자랑해 주세요. 생성기에서 "자랑게시판으로"를 누르면 여기에 올릴 수 있습니다.</p>

  <form id="new" class="new" hidden>
    <div id="new-face" class="face"></div>
    <div>
      <div class="line">
        <input id="new-text" type="text" maxlength="300" placeholder="한 줄 적기 (안 적어도 됩니다)" aria-label="한 줄 적기">
        <button type="submit" id="new-send" class="primary">올리기</button>
        <button type="button" id="new-cancel">취소</button>
      </div>
      <p id="msg" class="msg" role="status"></p>
    </div>
  </form>

  <!-- 내 닉네임 (IP 기준, 다른 사람과 겹치지 않음): 색 점을 누르면 색 프리셋, 이름은 주사위로만 -->
  <div id="me" class="me" hidden>
    <span>내 닉네임</span>
    <button type="button" id="me-dot" class="dot" aria-haspopup="listbox" aria-expanded="false" aria-label="닉네임 색 고르기" title="닉네임 색"></button>
    <span id="me-name" class="nick"></span>
    <button type="button" id="me-roll" class="ib" aria-label="닉네임 다시 뽑기" title="다시 뽑기"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="M8 8h.01M16 8h.01M12 12h.01M8 16h.01M16 16h.01"/></svg></button>
    <div id="me-colors" class="colors" role="listbox" aria-label="닉네임 색" hidden></div>
    <span id="me-msg" class="msg" role="status" style="margin:0"></span>
  </div>

  <div id="grid" class="grid"></div>
</main>

<div id="dim" class="dim" hidden>
  <button type="button" id="pop-prev" class="side prev" aria-label="이전 캐릭터" title="이전 (←)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg></button>
  <div class="pop" role="dialog" aria-modal="true" aria-label="자랑 글 (바깥을 누르거나 Esc, 뒤로 가기로 닫힘)" tabindex="-1">
    <div id="pop-face" class="face"></div>
    <div class="info">
    <p id="pop-text" class="text"></p>
    <div id="pop-edit" class="edit" hidden>
      <input id="pop-edit-text" type="text" maxlength="300" aria-label="한 줄 고치기">
      <button type="button" id="pop-edit-save" class="primary">저장</button>
    </div>
    <!-- 한 줄: 왼쪽 닉네임, 오른쪽 날짜 -->
    <div class="byline"><span id="pop-by" class="by"></span><span id="pop-when" class="when"></span></div>
    <p id="pop-msg" class="msg" role="status"></p>
    <div class="acts">
      <button type="button" id="pop-like" class="like" aria-pressed="false">추천</button>
      <button type="button" id="pop-copy-img">이미지 복사</button>
      <a id="pop-open" href="../">생성기에서 열기</a>
      <span class="mine"><button type="button" id="pop-fix" hidden>수정</button><button type="button" id="pop-del" class="danger" hidden>삭제</button></span>
    </div>
    <section class="comments" aria-label="댓글">
      <h2>댓글 <span id="pop-ccount"></span></h2>
      <ul id="pop-comments"></ul>
      <form id="pop-cform" class="cform">
        <input id="pop-ctext" type="text" maxlength="200" placeholder="댓글 달기" aria-label="댓글 달기">
        <button type="submit" id="pop-csend">등록</button>
      </form>
    </section>
    </div>
  </div>
  <button type="button" id="pop-next" class="side next" aria-label="다음 캐릭터" title="다음 (→)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg></button>
</div>

<button type="button" id="admin-login" class="adminlink">관리자 로그인</button>
<script src="../js/core.js"></script>
<script src="../js/palettes.js"></script>
<script src="../js/parts-data.js"></script>
<script>
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };
  var key = '', admin = false, posts = [], current = null;
  try { key = localStorage.getItem('board-admin') || ''; } catch (e) { /* 일반 방문자 */ }

  function api(path, body) {
    var opt = { headers: {} };
    if (key) opt.headers['x-admin-key'] = key;
    if (body) { opt.method = 'POST'; opt.headers['content-type'] = 'application/json'; opt.body = JSON.stringify(body); }
    return fetch('/api/board/show/' + path, opt).then(function (r) {
      return r.json().then(function (j) { if (!r.ok) throw new Error(j.error || '실패했습니다.'); return j; });
    });
  }
  function face(code) { return CG.compose(CG.decode(code)); }
  var THUMB = '<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 10v12"/><path d="M15 5.88 14 10h5.83a2 2 0 0 1 1.92 2.56l-2.33 8A2 2 0 0 1 17.5 22H4a2 2 0 0 1-2-2v-8a2 2 0 0 1 2-2h2.76a2 2 0 0 0 1.79-1.11L12 2a3.13 3.13 0 0 1 3 3.88Z"/></svg>';   // lucide thumbs-up

  // ---------- 올리기 (생성기의 "자랑하기"가 #new=조합코드 로 보낸다) ----------
  var draft = null;
  (function () {
    var m = /^#new=(.+)$/.exec(location.hash);
    if (!m) return;
    try { draft = decodeURIComponent(m[1]); } catch (e) { draft = m[1]; }
    history.replaceState(null, '', location.pathname);
    if (draft.indexOf(':') < 0) { draft = null; return; }
    draft = CG.encode(CG.decode(draft));
    $('new-face').innerHTML = face(draft);
    $('new').hidden = false;
    $('new-text').focus();
  })();
  // 취소: 생성기에서 넘어왔으면 그 캐릭터 그대로 생성기로 돌아간다
  $('new-cancel').onclick = function () {
    if (draft) { location.href = '/character/#' + encodeURIComponent(draft); return; }
    $('new').hidden = true;
  };
  $('new').onsubmit = function (e) {
    e.preventDefault();
    if (!draft) return;
    $('new-send').disabled = true; $('msg').textContent = '올리는 중…';
    api('submit', { code: draft, text: $('new-text').value }).then(function () {
      $('new').hidden = true; draft = null; load();
    }, function (x) { $('msg').textContent = x.message; }).then(function () { $('new-send').disabled = false; });
  };

  // ---------- 목록 ----------
  function load() {
    api('list').then(function (r) {
      admin = r.admin; posts = r.posts;
      // 내 닉네임: 아직 없으면 한 번 뽑아 달라고 한다
      if (r.me) paintMe(r.me); else if (!meAsked) { meAsked = true; nickApi({}).catch(function () {}); }
      // 팝업이 열려 있으면 같은 글의 새 내용으로 바꿔 둔다
      if (current) { for (var k = 0; k < posts.length; k++) if (posts[k].id === current.id) { current = posts[k]; paintComments(current); } }
      var g = $('grid'); g.textContent = '';
      if (!posts.length) { var e = document.createElement('p'); e.className = 'empty'; e.textContent = '아직 없습니다. 첫 캐릭터를 올려 보세요.'; g.appendChild(e); return; }
      posts.forEach(function (p) {
        var b = document.createElement('button'); b.type = 'button'; b.className = 'item';
        var f = document.createElement('div'); f.className = 'face'; f.innerHTML = face(p.code);
        var c = document.createElement('div'); c.className = 'cap';
        var nm = document.createElement('span'); nm.className = 'name'; nm.textContent = p.text || ''; c.appendChild(nm);
        var nc = (p.comments || []).length;
        if (nc) { var cc = document.createElement('span'); cc.className = 'cc'; cc.textContent = '[' + nc + ']'; cc.setAttribute('aria-label', '댓글 ' + nc + '개'); c.appendChild(cc); }
        b.setAttribute('aria-label', (p.text || '캐릭터') + ' 크게 보기');
        b.appendChild(f); b.appendChild(c);
        // 추천 받은 글은 왼쪽 위에 작게 따봉과 숫자
        if (p.likes) { var lk = document.createElement('span'); lk.className = 'likes'; lk.innerHTML = THUMB; lk.appendChild(document.createTextNode(String(p.likes))); b.appendChild(lk); }
        b.onclick = function () { open(p); };
        g.appendChild(b);
      });
    }, function () { $('grid').textContent = '목록을 불러오지 못했습니다.'; });
  }

  // ---------- 팝업 ----------
  function open(p) {
    current = p;
    $('pop-face').innerHTML = face(p.code);
    $('pop-text').textContent = p.text || '';
    $('pop-text').hidden = !p.text;
    $('pop-when').textContent = new Date(p.at).toLocaleString('ko-KR', { dateStyle: 'medium', timeStyle: 'short' });
    $('pop-open').href = '../#' + encodeURI(p.code);
    // 같은 IP로 올린 글은 올린 사람이 고치고 지울 수 있다 (관리자는 지우기만)
    paintLike(p);
    paintBy($('pop-by'), p.nick);
    paintComments(p);
    $('pop-ctext').value = '';
    $('pop-del').hidden = !(admin || p.mine);
    $('pop-fix').hidden = !p.mine;
    $('pop-edit').hidden = true;
    $('pop-msg').textContent = '';
    var i = posts.indexOf(p);
    $('pop-prev').disabled = i <= 0; $('pop-next').disabled = i < 0 || i >= posts.length - 1;
    var wasOpen = !$('dim').hidden;
    $('dim').hidden = false;
    // 뒤로 가기(휴대폰)는 팝업만 닫는다: 처음 열 때 기록을 하나 쌓고, 옆 글로 넘길 때는 그 기록을 바꾼다
    try { if (wasOpen) history.replaceState({ pop: p.id }, ''); else history.pushState({ pop: p.id }, ''); } catch (e) { /* 무시 */ }
    if (!wasOpen) document.querySelector('.pop').focus();
  }
  // 방향키(←→)나 이전·다음 버튼으로 옆 카드로 넘어간다. 목록이 새로 불러와져도 같은 글(id)을 기준으로 찾는다
  function move(d) {
    if (!current) return;
    var i = -1;
    for (var k = 0; k < posts.length; k++) if (posts[k].id === current.id) i = k;
    var j = i + d;
    if (i < 0 || j < 0 || j >= posts.length) return;
    open(posts[j]);
  }
  $('pop-prev').onclick = function () { move(-1); };
  $('pop-next').onclick = function () { move(1); };
  function hide() { $('dim').hidden = true; current = null; closeColors(); }
  // 바깥 클릭·Esc: 쌓아 둔 기록을 되돌려(뒤로 가기와 같은 길) 닫는다
  function close() {
    if (history.state && history.state.pop) history.back(); else hide();
  }
  window.addEventListener('popstate', function () { if (!$('dim').hidden) hide(); });
  function paintLike(p) {
    $('pop-like').setAttribute('aria-pressed', p.liked ? 'true' : 'false');
    $('pop-like').innerHTML = THUMB + '추천' + (p.likes ? ' ' + p.likes : '');
  }
  // 추천: 한 사람(같은 IP)당 한 번, 다시 누르면 취소
  $('pop-like').onclick = function () {
    var p = current; if (!p) return;
    $('pop-like').disabled = true;
    api('like', { id: p.id }).then(function (r) {
      p.likes = r.likes; p.liked = r.liked; paintLike(p);
      note(r.liked ? '추천했습니다.' : '추천을 취소했습니다.');
      load();
    }, function (x) { note(x.message); }).then(function () { $('pop-like').disabled = false; });
  };
  $('dim').addEventListener('click', function (e) { if (e.target === $('dim')) close(); });
  document.addEventListener('keydown', function (e) {
    if ($('dim').hidden) return;
    if (e.key === 'Escape') { close(); return; }
    var t = e.target;
    if (t && /^(INPUT|TEXTAREA)$/.test(t.tagName)) return;   // 한 줄 고치는 중에는 커서 이동
    if (e.key === 'ArrowRight') { e.preventDefault(); move(1); }
    if (e.key === 'ArrowLeft') { e.preventDefault(); move(-1); }
  });
  function note(t) { $('pop-msg').textContent = t; }

  // ---------- 닉네임 ----------
  // 부드러운 색 24개 (서버 worker/index.mjs 의 NICK_COLORS 와 같아야 한다)
  var COLORS = ['#d47a8a', '#d986a8', '#c97fb5', '#b98ccc', '#a487cf', '#8f8ad6', '#7b93d6', '#6f8fb0', '#6aa3d0', '#5aa3a8', '#5fae99', '#7fa37a', '#84996a', '#9aa55a', '#c4a24a', '#d4a05a', '#d9956b', '#e08a74', '#c98266', '#b58a96', '#a08c80', '#8c7166', '#9a8f8a', '#7f8fa3'];
  var me = null, meAsked = false;
  // 글·댓글의 닉네임 (닉네임이 생기기 전에 올린 사람은 "익명")
  function paintBy(el, n, inline) {
    var s = document.createElement('span'); s.className = 'nick';
    s.textContent = n ? n.name : '익명';
    s.style.color = n ? n.color : 'var(--muted)';
    if (inline) { el.appendChild(s); return; }
    el.textContent = ''; el.appendChild(s);
  }
  function paintMe(n) {
    me = n;
    $('me').hidden = false;
    $('me-name').textContent = n.name; $('me-name').style.color = n.color;
    $('me-dot').style.background = n.color;
    // 둘기마요(관리자)는 이름을 바꾸지 않는다. 색만 고른다
    $('me-roll').hidden = !!n.owner;
  }
  function meNote(t) { $('me-msg').textContent = t || ''; }
  function nickApi(body) {
    return api('nick', body).then(function (r) { paintMe(r.me); meNote(''); load(); return r; }, function (x) { meNote(x.message); throw x; });
  }
  $('me-roll').onclick = function () { $('me-roll').disabled = true; nickApi({ roll: true }).catch(function () {}).then(function () { $('me-roll').disabled = false; }); };
  // 색 점: 프리셋이 드롭다운처럼 뜬다
  function closeColors() { $('me-colors').hidden = true; $('me-dot').setAttribute('aria-expanded', 'false'); }
  $('me-dot').onclick = function (e) {
    e.stopPropagation();
    var box = $('me-colors');
    if (!box.hidden) { closeColors(); return; }
    box.textContent = '';
    COLORS.forEach(function (c) {
      var b = document.createElement('button'); b.type = 'button'; b.style.background = c;
      b.setAttribute('role', 'option'); b.setAttribute('aria-label', c); b.setAttribute('aria-selected', me && me.color === c ? 'true' : 'false');
      b.onclick = function () { closeColors(); nickApi({ color: c }).catch(function () {}); };
      box.appendChild(b);
    });
    box.hidden = false; $('me-dot').setAttribute('aria-expanded', 'true');
  };
  document.addEventListener('click', function (e) { if (!$('me-colors').hidden && !$('me-colors').contains(e.target) && e.target !== $('me-dot')) closeColors(); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && !$('me-colors').hidden) closeColors(); });

  // ---------- 댓글: 누구나 달고, 단 사람(같은 IP)과 관리자가 지운다 ----------
  function paintComments(p) {
    var list = p.comments || [], ul = $('pop-comments');
    ul.textContent = '';
    $('pop-ccount').textContent = list.length ? String(list.length) : '';
    if (!list.length) { var e = document.createElement('li'); e.className = 'none'; e.style.background = 'none'; e.style.padding = '0'; e.textContent = '아직 댓글이 없습니다.'; ul.appendChild(e); }
    list.forEach(function (c) {
      var li = document.createElement('li'), body = document.createElement('div'); body.className = 'body';
      paintBy(body, c.nick, true);
      body.appendChild(document.createTextNode(c.text));
      var m = document.createElement('span'); m.className = 'meta';
      m.textContent = new Date(c.at).toLocaleString('ko-KR', { dateStyle: 'short', timeStyle: 'short' }); body.appendChild(m);
      li.appendChild(body);
      if (c.mine || admin) {
        var x = document.createElement('button'); x.type = 'button'; x.className = 'x'; x.textContent = '×';
        x.setAttribute('aria-label', '댓글 지우기'); x.title = '지우기';
        x.onclick = function () {
          if (!confirm('댓글을 지울까요?')) return;
          api('uncomment', { id: p.id, cid: c.id }).then(function (r) { p.comments = r.comments; paintComments(p); load(); }, function (er) { note(er.message); });
        };
        li.appendChild(x);
      }
      ul.appendChild(li);
    });
  }
  $('pop-cform').onsubmit = function (e) {
    e.preventDefault();
    var p = current, text = $('pop-ctext').value.trim();
    if (!p || !text) return;
    $('pop-csend').disabled = true;
    api('comment', { id: p.id, text: text }).then(function (r) {
      p.comments = r.comments; $('pop-ctext').value = ''; paintComments(p); load();
      var ul = $('pop-comments'); if (ul.lastChild && ul.lastChild.scrollIntoView) ul.lastChild.scrollIntoView({ block: 'nearest' });
    }, function (er) { note(er.message); }).then(function () { $('pop-csend').disabled = false; });
  };

  // 생성기의 "이미지 복사"와 같은 이미지 (왼쪽 위 구석에 DOVEMAYO.COM)
  function png(code) {
    var size = 1024, state = CG.decode(code);
    var fonts = document.fonts && document.fonts.load ? document.fonts.load('32px "Dovemayo Gothic"', 'DOVEMAYO.COM').catch(function () {}) : Promise.resolve();
    return fonts.then(function () {
      return new Promise(function (resolve, reject) {
        var url = URL.createObjectURL(new Blob([CG.compose(state, { size: size })], { type: 'image/svg+xml' })), img = new Image();
        img.onload = function () {
          var c = document.createElement('canvas'); c.width = c.height = size;
          var ctx = c.getContext('2d'); ctx.drawImage(img, 0, 0, size, size); URL.revokeObjectURL(url);
          var bg = null, dark = false;
          CG.palettes.bg.forEach(function (x) { if (x.id === state.bgColor) bg = x.hex; });
          if (bg) { var n = parseInt(bg.slice(1), 16); dark = (0.299 * (n >> 16) + 0.587 * ((n >> 8) & 255) + 0.114 * (n & 255)) < 110; }
          ctx.font = Math.round(size * 0.03) + 'px "Dovemayo Gothic", Arial, sans-serif';
          ctx.textBaseline = 'top';
          ctx.fillStyle = dark ? 'rgba(255,255,255,.42)' : 'rgba(43,37,35,.30)';
          ctx.fillText('DOVEMAYO.COM', size * 0.022, size * 0.02);
          c.toBlob(function (b) { if (b) resolve(b); else reject(new Error('png')); }, 'image/png');
        };
        img.onerror = function () { URL.revokeObjectURL(url); reject(new Error('svg')); };
        img.src = url;
      });
    });
  }
  $('pop-copy-img').onclick = function () {
    var blob = png(current.code);
    function asFile() {
      blob.then(function (b) {
        var a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = 'character.png';
        document.body.appendChild(a); a.click(); a.remove();
        note('복사가 안 돼서 파일로 저장했습니다.');
      }, function () { note('이미지를 만들지 못했습니다.'); });
    }
    if (!(navigator.clipboard && navigator.clipboard.write && window.ClipboardItem)) { asFile(); return; }
    try { navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })]).then(function () { note('이미지를 복사했습니다.'); }, asFile); }
    catch (e) { asFile(); }
  };
  $('pop-fix').onclick = function () {
    $('pop-edit').hidden = !$('pop-edit').hidden;
    if ($('pop-edit').hidden) return;
    $('pop-edit-text').value = current.text || '';
    $('pop-edit-text').focus();
  };
  $('pop-edit-save').onclick = function () {
    var p = current, text = $('pop-edit-text').value;
    $('pop-edit-save').disabled = true;
    api('edit', { id: p.id, text: text }).then(function () {
      p.text = text.replace(/\s+/g, ' ').trim();
      $('pop-text').textContent = p.text; $('pop-text').hidden = !p.text; $('pop-edit').hidden = true;
      note('고쳤습니다.'); load();
    }, function (x) { note(x.message); }).then(function () { $('pop-edit-save').disabled = false; });
  };
  $('pop-edit-text').addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); $('pop-edit-save').click(); } });
  $('pop-del').onclick = function () {
    if (!confirm('삭제할까요?')) return;
    api('delete', { id: current.id }).then(function () { close(); load(); }, function (x) { note(x.message); });
  };

  // 오른쪽 아래의 작은 "관리자 로그인": 비밀번호가 맞으면 이 브라우저에서 관리 버튼이 보인다
  $('admin-login').onclick = function () {
    if (key && confirm('관리자 로그아웃할까요?')) { key = ''; try { localStorage.removeItem('board-admin'); } catch (e) {} load(); return; }
    if (key) return;
    var pw = prompt('관리자 비밀번호');
    if (!pw) return;
    fetch('/api/board/list', { headers: { 'x-admin-key': pw.trim() } }).then(function (r) { return r.json(); }).then(function (j) {
      if (!j.admin) { alert('비밀번호가 맞지 않습니다.'); return; }
      key = pw.trim(); try { localStorage.setItem('board-admin', key); } catch (e) {}
      load();
    }, function () { alert('확인하지 못했습니다.'); });
  };
  load();
})();
  // 생성기로 돌아가는 링크: 생성기가 마지막으로 그린 캐릭터(localStorage cg-last)로 돌아간다
  (function () {
    var last = null;
    try { last = localStorage.getItem('cg-last'); } catch (e) { /* 무시 */ }
    if (!last || last.indexOf(':') < 0) return;
    var a = document.querySelectorAll('a.back[href="../"]');
    for (var i = 0; i < a.length; i++) a[i].href = '../#' + last;
  })();
</script>
</body>
</html>
