<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>자랑 게시판 · 랜덤 캐릭터 생성기</title>
<style>
@font-face{font-family:"Dovemayo Gothic";src:url("../fonts/dovemayo-gothic-latin.woff2") format("woff2");font-display:swap}
:root{--page:#f4f1ee;--card:#fff;--ink:#2b2523;--muted:#7d726e;--rule:#e4ddd8;--accent:#5d4e48;--on:#c9573f}
*{box-sizing:border-box}
body{margin:0;background:var(--page);color:var(--ink);font:15px/1.55 "Pretendard","Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif}
main{max-width:980px;margin:0 auto;padding:28px 16px 64px}
h1{font-size:22px;margin:0}
.back{font-size:13px;color:var(--muted)}
.lead{color:var(--muted);margin:8px 0 18px}
button{font:inherit;color:var(--ink);background:#fff;border:1px solid var(--rule);border-radius:10px;padding:8px 14px;cursor:pointer}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
button.danger{color:var(--on)}
button:disabled{opacity:.45;cursor:default}
button:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--on);outline-offset:2px}
input[type=text]{font:inherit;color:inherit;border:1px solid var(--rule);border-radius:10px;padding:8px 10px;background:#fff;min-width:0}
.new{display:grid;grid-template-columns:120px 1fr;gap:14px;align-items:center;background:var(--card);border:1px solid var(--rule);border-radius:18px;padding:14px;margin-bottom:22px}
.new .face{border-radius:16px;overflow:hidden;aspect-ratio:1}
.new .line{display:flex;gap:8px}
.new .line input{flex:1}
.msg{min-height:1.4em;font-size:13px;color:var(--muted);margin:6px 0 0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.item{padding:0;border:0;background:none;text-align:center;border-radius:16px;cursor:pointer;display:block;width:100%}
.item .face{border-radius:16px;overflow:hidden;aspect-ratio:1;box-shadow:0 1px 2px rgba(60,40,30,.08),0 6px 16px rgba(60,40,30,.08)}
.face svg{display:block;width:100%;height:100%}
.item .cap{margin:6px 2px 0;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-height:1.5em}
.empty{color:var(--muted);font-size:13px}
.dim{position:fixed;inset:0;background:rgba(30,24,22,.62);display:grid;place-items:center;padding:16px;z-index:10}
.pop{background:var(--card);border-radius:20px;padding:16px;width:min(100%,460px);max-height:calc(100vh - 32px);max-height:calc(100dvh - 32px);overflow:auto}
.pop .face{border-radius:16px;overflow:hidden;aspect-ratio:1}
.pop .text{margin:12px 2px 0;white-space:pre-wrap;overflow-wrap:anywhere;text-align:center}
.pop .edit{display:flex;gap:8px;margin-top:12px}
.pop .edit input{flex:1}
.pop .when{font-size:12px;color:var(--muted);margin:2px 2px 10px;text-align:center}
.pop .code{display:flex;gap:8px}
.pop .code input{flex:1;font:12px/1.4 ui-monospace,Consolas,monospace}
.pop .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.pop .acts a{display:inline-block;text-decoration:none;color:var(--ink);border:1px solid var(--rule);border-radius:10px;padding:8px 14px;background:#fff}
.pop .acts .close{margin-left:auto}
[hidden]{display:none!important}
@media(max-width:520px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.new{grid-template-columns:88px 1fr}.new .line{flex-direction:column}}
.adminlink{position:fixed;right:8px;bottom:6px;font-size:11px;color:var(--muted);opacity:.35;background:none;border:0;padding:4px;cursor:pointer}.adminlink:hover,.adminlink:focus-visible{opacity:.9}
</style>
</head>
<body>
<main>
  <a class="back" href="../">← 랜덤 캐릭터 생성기</a> &nbsp; <a class="back" href="../board/">제안 게시판</a>
  <h1>자랑 게시판</h1>
  <p class="lead">만든 캐릭터를 자랑해 주세요. 생성기에서 "자랑게시판으로"를 누르면 여기에 올릴 수 있습니다.</p>

  <form id="new" class="new" hidden>
    <div id="new-face" class="face"></div>
    <div>
      <div class="line">
        <input id="new-text" type="text" maxlength="300" placeholder="한 줄 적기 (안 적어도 됩니다)" aria-label="한 줄 적기">
        <button type="submit" id="new-send" class="primary">올리기</button>
        <button type="button" id="new-cancel">취소</button>
      </div>
      <p id="msg" class="msg" role="status"></p>
    </div>
  </form>

  <div id="grid" class="grid"></div>
</main>

<div id="dim" class="dim" hidden>
  <div class="pop" role="dialog" aria-modal="true" aria-label="자랑 글">
    <div id="pop-face" class="face"></div>
    <p id="pop-text" class="text"></p>
    <div id="pop-edit" class="edit" hidden>
      <input id="pop-edit-text" type="text" maxlength="300" aria-label="한 줄 고치기">
      <button type="button" id="pop-edit-save" class="primary">저장</button>
    </div>
    <p id="pop-when" class="when"></p>
    <div class="code">
      <input id="pop-code" type="text" readonly aria-label="조합 코드">
      <button type="button" id="pop-copy-code">코드 복사</button>
    </div>
    <div class="acts">
      <button type="button" id="pop-copy-img">이미지 복사</button>
      <a id="pop-open" href="../">생성기에서 열기</a>
      <button type="button" id="pop-fix" hidden>수정</button>
      <button type="button" id="pop-del" class="danger" hidden>삭제</button>
      <button type="button" id="pop-close" class="close">닫기</button>
    </div>
    <p id="pop-msg" class="msg" role="status"></p>
  </div>
</div>

<button type="button" id="admin-login" class="adminlink">관리자 로그인</button>
<script src="../js/core.js"></script>
<script src="../js/palettes.js"></script>
<script src="../js/parts-data.js"></script>
<script>
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };
  var key = '', admin = false, posts = [], current = null;
  try { key = localStorage.getItem('board-admin') || ''; } catch (e) { /* 일반 방문자 */ }

  function api(path, body) {
    var opt = { headers: {} };
    if (key) opt.headers['x-admin-key'] = key;
    if (body) { opt.method = 'POST'; opt.headers['content-type'] = 'application/json'; opt.body = JSON.stringify(body); }
    return fetch('/api/board/show/' + path, opt).then(function (r) {
      return r.json().then(function (j) { if (!r.ok) throw new Error(j.error || '실패했습니다.'); return j; });
    });
  }
  function face(code) { return CG.compose(CG.decode(code)); }

  // ---------- 올리기 (생성기의 "자랑하기"가 #new=조합코드 로 보낸다) ----------
  var draft = null;
  (function () {
    var m = /^#new=(.+)$/.exec(location.hash);
    if (!m) return;
    try { draft = decodeURIComponent(m[1]); } catch (e) { draft = m[1]; }
    history.replaceState(null, '', location.pathname);
    if (draft.indexOf(':') < 0) { draft = null; return; }
    draft = CG.encode(CG.decode(draft));
    $('new-face').innerHTML = face(draft);
    $('new').hidden = false;
    $('new-text').focus();
  })();
  // 취소: 생성기에서 넘어왔으면 그 캐릭터 그대로 생성기로 돌아간다
  $('new-cancel').onclick = function () {
    if (draft) { location.href = '/character/#' + encodeURIComponent(draft); return; }
    $('new').hidden = true;
  };
  $('new').onsubmit = function (e) {
    e.preventDefault();
    if (!draft) return;
    $('new-send').disabled = true; $('msg').textContent = '올리는 중…';
    api('submit', { code: draft, text: $('new-text').value }).then(function () {
      $('new').hidden = true; draft = null; load();
    }, function (x) { $('msg').textContent = x.message; }).then(function () { $('new-send').disabled = false; });
  };

  // ---------- 목록 ----------
  function load() {
    api('list').then(function (r) {
      admin = r.admin; posts = r.posts;
      var g = $('grid'); g.textContent = '';
      if (!posts.length) { var e = document.createElement('p'); e.className = 'empty'; e.textContent = '아직 없습니다. 첫 캐릭터를 올려 보세요.'; g.appendChild(e); return; }
      posts.forEach(function (p) {
        var b = document.createElement('button'); b.type = 'button'; b.className = 'item';
        var f = document.createElement('div'); f.className = 'face'; f.innerHTML = face(p.code);
        var c = document.createElement('div'); c.className = 'cap'; c.textContent = p.text || '';
        b.setAttribute('aria-label', (p.text || '캐릭터') + ' 크게 보기');
        b.appendChild(f); b.appendChild(c);
        b.onclick = function () { open(p); };
        g.appendChild(b);
      });
    }, function () { $('grid').textContent = '목록을 불러오지 못했습니다.'; });
  }

  // ---------- 팝업 ----------
  function open(p) {
    current = p;
    $('pop-face').innerHTML = face(p.code);
    $('pop-text').textContent = p.text || '';
    $('pop-text').hidden = !p.text;
    $('pop-when').textContent = new Date(p.at).toLocaleString('ko-KR', { dateStyle: 'medium', timeStyle: 'short' });
    $('pop-code').value = p.code;
    $('pop-open').href = '../#' + encodeURI(p.code);
    // 같은 IP로 올린 글은 올린 사람이 고치고 지울 수 있다 (관리자는 지우기만)
    $('pop-del').hidden = !(admin || p.mine);
    $('pop-fix').hidden = !p.mine;
    $('pop-edit').hidden = true;
    $('pop-msg').textContent = '';
    $('dim').hidden = false;
    $('pop-close').focus();
  }
  function close() { $('dim').hidden = true; current = null; }
  $('pop-close').onclick = close;
  $('dim').addEventListener('click', function (e) { if (e.target === $('dim')) close(); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && !$('dim').hidden) close(); });
  function note(t) { $('pop-msg').textContent = t; }

  $('pop-copy-code').onclick = function () {
    var done = function () { note('조합 코드를 복사했습니다.'); };
    var manual = function () { $('pop-code').select(); try { document.execCommand('copy'); done(); } catch (e) { note('직접 선택해 복사해 주세요.'); } };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(current.code).then(done, manual); else manual();
  };

  // 생성기의 "이미지 복사"와 같은 이미지 (왼쪽 위 구석에 DOVEMAYO.COM)
  function png(code) {
    var size = 1024, state = CG.decode(code);
    var fonts = document.fonts && document.fonts.load ? document.fonts.load('32px "Dovemayo Gothic"', 'DOVEMAYO.COM').catch(function () {}) : Promise.resolve();
    return fonts.then(function () {
      return new Promise(function (resolve, reject) {
        var url = URL.createObjectURL(new Blob([CG.compose(state, { size: size })], { type: 'image/svg+xml' })), img = new Image();
        img.onload = function () {
          var c = document.createElement('canvas'); c.width = c.height = size;
          var ctx = c.getContext('2d'); ctx.drawImage(img, 0, 0, size, size); URL.revokeObjectURL(url);
          var bg = null, dark = false;
          CG.palettes.bg.forEach(function (x) { if (x.id === state.bgColor) bg = x.hex; });
          if (bg) { var n = parseInt(bg.slice(1), 16); dark = (0.299 * (n >> 16) + 0.587 * ((n >> 8) & 255) + 0.114 * (n & 255)) < 110; }
          ctx.font = Math.round(size * 0.03) + 'px "Dovemayo Gothic", Arial, sans-serif';
          ctx.textBaseline = 'top';
          ctx.fillStyle = dark ? 'rgba(255,255,255,.42)' : 'rgba(43,37,35,.30)';
          ctx.fillText('DOVEMAYO.COM', size * 0.022, size * 0.02);
          c.toBlob(function (b) { if (b) resolve(b); else reject(new Error('png')); }, 'image/png');
        };
        img.onerror = function () { URL.revokeObjectURL(url); reject(new Error('svg')); };
        img.src = url;
      });
    });
  }
  $('pop-copy-img').onclick = function () {
    var blob = png(current.code);
    function asFile() {
      blob.then(function (b) {
        var a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = 'character.png';
        document.body.appendChild(a); a.click(); a.remove();
        note('복사가 안 돼서 파일로 저장했습니다.');
      }, function () { note('이미지를 만들지 못했습니다.'); });
    }
    if (!(navigator.clipboard && navigator.clipboard.write && window.ClipboardItem)) { asFile(); return; }
    try { navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })]).then(function () { note('이미지를 복사했습니다.'); }, asFile); }
    catch (e) { asFile(); }
  };
  $('pop-fix').onclick = function () {
    $('pop-edit').hidden = !$('pop-edit').hidden;
    if ($('pop-edit').hidden) return;
    $('pop-edit-text').value = current.text || '';
    $('pop-edit-text').focus();
  };
  $('pop-edit-save').onclick = function () {
    var p = current, text = $('pop-edit-text').value;
    $('pop-edit-save').disabled = true;
    api('edit', { id: p.id, text: text }).then(function () {
      p.text = text.replace(/\s+/g, ' ').trim();
      $('pop-text').textContent = p.text; $('pop-text').hidden = !p.text; $('pop-edit').hidden = true;
      note('고쳤습니다.'); load();
    }, function (x) { note(x.message); }).then(function () { $('pop-edit-save').disabled = false; });
  };
  $('pop-edit-text').addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); $('pop-edit-save').click(); } });
  $('pop-del').onclick = function () {
    if (!confirm('삭제할까요?')) return;
    api('delete', { id: current.id }).then(function () { close(); load(); }, function (x) { note(x.message); });
  };

  // 오른쪽 아래의 작은 "관리자 로그인": 비밀번호가 맞으면 이 브라우저에서 관리 버튼이 보인다
  $('admin-login').onclick = function () {
    if (key && confirm('관리자 로그아웃할까요?')) { key = ''; try { localStorage.removeItem('board-admin'); } catch (e) {} load(); return; }
    if (key) return;
    var pw = prompt('관리자 비밀번호');
    if (!pw) return;
    fetch('/api/board/list', { headers: { 'x-admin-key': pw.trim() } }).then(function (r) { return r.json(); }).then(function (j) {
      if (!j.admin) { alert('비밀번호가 맞지 않습니다.'); return; }
      key = pw.trim(); try { localStorage.setItem('board-admin', key); } catch (e) {}
      load();
    }, function () { alert('확인하지 못했습니다.'); });
  };
  load();
})();
</script>
</body>
</html>
