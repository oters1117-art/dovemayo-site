<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>랜덤 이름 생성기</title>
<meta name="description" content="한국 이름(흔한 정도 조절)과 스포어식 이름(형용사 + 명사)을 뽑는 랜덤 이름 생성기. 이름을 누르면 복사됩니다.">
<style>
:root{--page:#f4f1ee;--card:#fff;--ink:#2b2523;--muted:#7d726e;--rule:#e4ddd8;--accent:#5d4e48;--on:#c9573f}
*{box-sizing:border-box}
body{margin:0;background:var(--page);color:var(--ink);font:15px/1.55 "Pretendard","Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif}
main{max-width:720px;margin:0 auto;padding:28px 16px 72px}
h1{font-size:22px;margin:0}
.back{font-size:13px;color:var(--muted)}
.lead{color:var(--muted);margin:8px 0 16px}
.box{background:var(--card);border:1px solid var(--rule);border-radius:18px;padding:14px 16px}
.row{display:grid;grid-template-columns:6.5em 1fr 6.5em;gap:10px;align-items:center;margin:6px 0}
.row span{font-size:13px;color:var(--muted);white-space:nowrap}
.row span:last-child{text-align:right}
@media(max-width:420px){.row{grid-template-columns:5.6em 1fr 5.6em}.row span{font-size:12px}}
input[type=range]{width:100%;accent-color:var(--accent);margin:0}
.note{font-size:12px;color:var(--muted);margin:2px 0 10px}
.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.bar label{font-size:13px;color:var(--muted);margin-right:auto;display:flex;gap:6px;align-items:center}
button{font:inherit;color:var(--ink);background:#fff;border:1px solid var(--rule);border-radius:10px;padding:8px 14px;cursor:pointer}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600;padding:9px 22px}
button:focus-visible,input:focus-visible{outline:2px solid var(--on);outline-offset:2px}
h2{font-size:15px;margin:24px 0 8px}
.names{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.names button{padding:9px 4px;border-radius:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.names button:hover{border-color:#c9bfb9}
.names button.done{background:var(--accent);border-color:var(--accent);color:#fff}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:#fff;font-size:13px;padding:8px 14px;border-radius:999px;opacity:0;pointer-events:none;transition:opacity .15s}
#toast.on{opacity:.92}
@media(max-width:520px){.names{grid-template-columns:repeat(3,minmax(0,1fr))}}
/* 한글 이름 / 스포어식 이름 탭 */
.tabs{display:flex;gap:6px;margin:0 0 14px}
.tabs button{border-radius:999px;padding:7px 16px}
.tabs button[aria-selected=true]{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.names.spore{grid-template-columns:repeat(3,minmax(0,1fr))}
.names.spore.one{grid-template-columns:minmax(0,1fr)}
.names.spore.one button{padding:22px 8px;font-size:22px;font-weight:600}
@media(max-width:520px){.names.spore{grid-template-columns:repeat(2,minmax(0,1fr))}}
/* 스포어식 탭: 같은 밝기의 연보라 배경 */
body{transition:background-color .2s}
body.spore{background:#f0edf6}
</style>
</head>
<body>
<main>
  <a class="back" href="https://dovemayo.com/">← dovemayo.com</a>
  <h1>랜덤 이름 생성기</h1>
  <p class="lead">이름을 누르면 복사됩니다.</p>

  <div class="tabs" role="tablist" aria-label="이름 종류">
    <button type="button" role="tab" id="tab-ko" aria-controls="pane-ko" aria-selected="true">한글 이름</button>
    <button type="button" role="tab" id="tab-spore" aria-controls="pane-spore" aria-selected="false">스포어식 이름</button>
  </div>

  <section id="pane-ko" role="tabpanel" aria-labelledby="tab-ko">
  <div class="box">
    <div class="row"><span>희귀한 성씨</span><input id="w-sur" type="range" min="-10" max="10" step="1" value="5" aria-label="성씨: 희귀한 쪽에서 흔한 쪽까지"><span>흔한 성씨</span></div>
    <div class="row"><span>희귀한 이름</span><input id="w-name" type="range" min="-10" max="10" step="1" value="5" aria-label="이름: 희귀한 쪽에서 흔한 쪽까지"><span>흔한 이름</span></div>
    <div class="bar">
      <label><input id="space" type="checkbox"> 성과 이름 띄어 쓰기</label>
      <button type="button" id="again" class="primary">다시 뽑기</button>
    </div>
  </div>

  <h2>여자</h2>
  <div id="female" class="names"></div>
  <h2>남자</h2>
  <div id="male" class="names"></div>
  </section>

  <!-- 스포어식 이름: 형용사 + 명사 (spore-data.js, 원본은 spore_name_gen.xlsx) -->
  <section id="pane-spore" role="tabpanel" aria-labelledby="tab-spore" hidden>
  <div class="box">
    <p class="note" style="margin-top:0">형용사와 명사를 하나씩 골라 붙입니다. 예: 귀여운 고양이</p>
    <div class="bar">
      <label><input id="spore-many" type="checkbox"> 여러 개 뽑기</label>
      <button type="button" id="spore-again" class="primary">다시 뽑기</button>
    </div>
  </div>
  <h2>이름</h2>
  <div id="spore" class="names spore"></div>
  </section>
</main>
<div id="toast" role="status"></div>
<script src="names-data.js"></script>
<script src="spore-data.js"></script>
<script>
(function () {
  'use strict';
  var D = window.NAME_DATA, COUNT = 30;
  var $ = function (id) { return document.getElementById(id); };

  // 순위 i (0 = 가장 흔함) 의 비중 = 기본 비중 × exp(-가중치 × i / 개수).
  // 슬라이더 가운데(0)는 모두 같고, 오른쪽 끝(10)은 흔한 쪽, 왼쪽 끝(-10)은 희귀한 쪽에서 거의 다 나온다.
  function table(list, weight) {
    var n = list.length, sum = 0, acc = [];
    for (var i = 0; i < n; i++) {
      var base = typeof list[i] === 'string' ? 1 : list[i][1];
      sum += base * Math.exp(-weight * i / n);
      acc.push(sum);
    }
    return function () {
      var r = Math.random() * sum, lo = 0, hi = n - 1;
      while (lo < hi) { var mid = (lo + hi) >> 1; if (acc[mid] < r) lo = mid + 1; else hi = mid; }
      return typeof list[lo] === 'string' ? list[lo] : list[lo][0];
    };
  }

  var toastTimer = 0;
  function toast(t) {
    var el = $('toast'); el.textContent = t; el.className = 'on';
    clearTimeout(toastTimer); toastTimer = setTimeout(function () { el.className = ''; }, 1400);
  }
  function copy(text) {
    if (navigator.clipboard && navigator.clipboard.writeText) return navigator.clipboard.writeText(text);
    return new Promise(function (ok, no) {
      var t = document.createElement('textarea'); t.value = text; t.style.position = 'fixed'; t.style.opacity = '0';
      document.body.appendChild(t); t.select();
      var done = false; try { done = document.execCommand('copy'); } catch (e) {}
      document.body.removeChild(t); done ? ok() : no();
    });
  }

  function fill(box, pickSur, pickName, gap) {
    box.textContent = '';
    var seen = {};
    for (var i = 0, tries = 0; i < COUNT && tries < COUNT * 20; tries++) {
      var name = pickSur() + gap + pickName();
      if (seen[name]) continue;
      seen[name] = 1; i++;
      var b = document.createElement('button');
      b.type = 'button'; b.textContent = name;
      box.appendChild(b);
    }
  }
  function draw() {
    var ws = +$('w-sur').value, wn = +$('w-name').value, gap = $('space').checked ? ' ' : '';
    var sur = table(D.surnames, ws);
    fill($('female'), sur, table(D.female, wn), gap);
    fill($('male'), sur, table(D.male, wn), gap);
    try { localStorage.setItem('name-gen', JSON.stringify({ s: ws, n: wn, g: !!gap })); } catch (e) {}
  }
  document.addEventListener('click', function (e) {
    var b = e.target.closest && e.target.closest('.names button');
    if (!b) return;
    copy(b.textContent).then(function () {
      var old = document.querySelector('.names button.done'); if (old) old.className = '';
      b.className = 'done'; toast('복사했습니다: ' + b.textContent);
    }, function () { toast('복사하지 못했습니다.'); });
  });

  try {
    var saved = JSON.parse(localStorage.getItem('name-gen') || 'null');
    if (saved) { $('w-sur').value = saved.s; $('w-name').value = saved.n; $('space').checked = !!saved.g; }
  } catch (e) {}
  $('w-sur').oninput = $('w-name').oninput = $('space').onchange = $('again').onclick = draw;
  draw();

  // ---------- 스포어식 이름 ----------
  var S = window.SPORE_DATA;
  function drawSpore() {
    // 형용사와 명사 사이는 늘 띄어 쓴다
    var box = $('spore'), gap = ' ', seen = {};
    var many = $('spore-many').checked, count = many ? COUNT : 1;
    box.textContent = '';
    box.className = 'names spore' + (many ? '' : ' one');
    try { localStorage.setItem('name-spore', JSON.stringify({ m: many })); } catch (e) {}
    for (var i = 0, tries = 0; i < count && tries < COUNT * 20; tries++) {
      var name = S.adj[Math.floor(Math.random() * S.adj.length)] + gap + S.noun[Math.floor(Math.random() * S.noun.length)];
      if (seen[name]) continue;
      seen[name] = 1; i++;
      var b = document.createElement('button'); b.type = 'button'; b.textContent = name; box.appendChild(b);
    }
  }
  try {
    var sp = JSON.parse(localStorage.getItem('name-spore') || 'null');
    if (sp) $('spore-many').checked = !!sp.m;
  } catch (e) {}
  $('spore-many').onchange = $('spore-again').onclick = drawSpore;
  drawSpore();

  // 탭: 마지막에 본 탭을 기억한다 (주소 #spore 로도 열린다)
  function tab(which) {
    ['ko', 'spore'].forEach(function (t) {
      $('tab-' + t).setAttribute('aria-selected', t === which ? 'true' : 'false');
      $('pane-' + t).hidden = t !== which;
    });
    document.body.classList.toggle('spore', which === 'spore');
    try { localStorage.setItem('name-tab', which); } catch (e) {}
  }
  $('tab-ko').onclick = function () { tab('ko'); };
  $('tab-spore').onclick = function () { tab('spore'); };
  var first = location.hash === '#spore' ? 'spore' : location.hash === '#ko' ? 'ko' : null;
  if (!first) { try { first = localStorage.getItem('name-tab'); } catch (e) {} }
  tab(first === 'spore' ? 'spore' : 'ko');
})();
</script>
</body>
</html>
